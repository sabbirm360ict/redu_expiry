
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reduan Mridha — 4 Year Countdown | Reduan Mridha</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">

<style>
:root {
  --text: #171717;
  --text-2: #525252;
  --text-3: #8a8a8a;
  --border: #e5e5e5;
  --bg: #ffffff;
  --tile: #fafafa;
  --dot: #16a34a;
}

[data-theme="dark"] {
  --text: #f5f5f5;
  --text-2: #a3a3a3;
  --text-3: #929292;
  --border: #303030;
  --bg: #0f0f0f;
  --tile: #171717;
  --dot: #22c55e;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Isometra', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  transition: background 0.25s ease, color 0.25s ease;
}

.page {
  width: 100%;
  max-width: 900px;
}

.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: 0.02em;
}

.by {
  font-size: 15px;
  color: var(--text-2);
  margin-top: 6px;
}

.toggle {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.toggle:hover {
  background: var(--tile);
}

.toggle svg {
  width: 21px;
  height: 21px;
}

.status {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 32px 0 20px;
  font-size: 14px;
  color: var(--text-2);
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--dot);
  flex-shrink: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.tile {
  min-width: 0;
  min-height: 112px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 10px 18px;
  background: var(--tile);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.val {
  font-family: 'Isometra', serif;
  font-size: clamp(25px, 3.4vw, 38px);
  font-weight: 500;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  white-space: nowrap;
  max-width: 100%;
}

.lab {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 8px;
  letter-spacing: 0.06em;
  text-transform: lowercase;
}

.tile.microseconds .val {
  font-family: Arial, sans-serif;
  font-size: clamp(19px, 2.5vw, 27px);
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}

.tile.milliseconds .val {
  font-size: clamp(25px, 3vw, 34px);
}

.foot {
  margin-top: 24px;
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.7;
}

@media (max-width: 600px) {
  body {
    padding: 20px 14px;
  }

  .page {
    max-width: 440px;
  }

  .status {
    margin-top: 26px;
    font-size: 12px;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .tile {
    min-height: 105px;
    padding: 18px 8px 14px;
  }

  .val {
    font-size: clamp(25px, 7vw, 34px);
  }

  .tile.microseconds .val {
    font-size: clamp(20px, 5.5vw, 25px);
  }

  .lab {
    font-size: 11px;
  }
}

@media (max-width: 340px) {
  .tile {
    padding-left: 4px;
    padding-right: 4px;
  }

  .tile.microseconds .val {
    font-size: 18px;
  }
}
</style>
</head>

<body>
<div class="page">

  <header class="header">
    <div>
      <div class="brand">M360 ICT</div>
      <div class="by">Reduan Mridha</div>
    </div>

    <button class="toggle" id="theme-btn"
      aria-label="Toggle light and dark mode"
      type="button">

      <svg id="icon-sun" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>

      <svg id="icon-moon" viewBox="0 0 24 24" fill="none"
        style="display:none">
        <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <div class="status">
    <span class="dot"></span>
    <span id="status-text">Calculating countdown...</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot" id="foot">
    Target: 1 September 2030 · Dhaka, Bangladesh (UTC+6).
  </div>

</div>

<script>
(function () {
  'use strict';

  // Target: 1 September 2030, 12:00 AM Dhaka time (UTC+6).
  // Four years from 1 September 2026.
  const DHAKA_OFFSET_MS = 6 * 60 * 60 * 1000;

  const TARGET = Date.UTC(2030, 8, 1, 0, 0, 0, 0)
    - DHAKA_OFFSET_MS;

  const units = [
    'years',
    'months',
    'days',
    'hours',
    'minutes',
    'seconds',
    'milliseconds',
    'microseconds'
  ];

  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status-text');

  // Create countdown tiles.
  units.forEach(function (unit) {
    const tile = document.createElement('div');
    tile.className = 'tile ' + unit;

    const value = document.createElement('div');
    value.className = 'val';
    value.id = 'v-' + unit;
    value.textContent = '0';

    const label = document.createElement('div');
    label.className = 'lab';
    label.textContent = unit;

    tile.appendChild(value);
    tile.appendChild(label);
    grid.appendChild(tile);
  });

  // Represent Dhaka local time using UTC date fields.
  function dhakaNow() {
    return new Date(Date.now() + DHAKA_OFFSET_MS);
  }

  function daysInMonth(year, month) {
    return new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  }

  // Add calendar months without overflowing the end of a month.
  function addMonths(date, amount) {
    const totalMonth = date.getUTCFullYear() * 12
      + date.getUTCMonth() + amount;

    const year = Math.floor(totalMonth / 12);
    const month = totalMonth - year * 12;
    const day = Math.min(date.getUTCDate(), daysInMonth(year, month));

    return new Date(Date.UTC(
      year,
      month,
      day,
      date.getUTCHours(),
      date.getUTCMinutes(),
      date.getUTCSeconds(),
      date.getUTCMilliseconds()
    ));
  }

  function addYears(date, amount) {
    return addMonths(date, amount * 12);
  }

  function breakdown(start, end) {
    // Both dates use Dhaka wall-clock values represented as UTC.
    let years = end.getUTCFullYear() - start.getUTCFullYear();
    let anchor = addYears(start, years);

    if (anchor > end) {
      years--;
      anchor = addYears(start, years);
    }

    let months =
      (end.getUTCFullYear() - anchor.getUTCFullYear()) * 12
      + end.getUTCMonth() - anchor.getUTCMonth();

    let monthAnchor = addMonths(anchor, months);

    if (monthAnchor > end) {
      months--;
      monthAnchor = addMonths(anchor, months);
    }

    const remainingMs = end.getTime() - monthAnchor.getTime();

    const days = Math.floor(remainingMs / 86400000);
    const afterDays = remainingMs - days * 86400000;

    const hours = Math.floor(afterDays / 3600000);
    const afterHours = afterDays - hours * 3600000;

    const minutes = Math.floor(afterHours / 60000);
    const afterMinutes = afterHours - minutes * 60000;

    const seconds = Math.floor(afterMinutes / 1000);
    const milliseconds = afterMinutes - seconds * 1000;

    return {
      years: years,
      months: months,
      days: days,
      hours: hours,
      minutes: minutes,
      seconds: seconds,
      milliseconds: milliseconds,
      millisecondsRaw: milliseconds
    };
  }

  function render() {
    const nowMs = Date.now();
    const past = nowMs >= TARGET;

    const nowDhaka = dhakaNow();
    const targetDhaka = new Date(TARGET + DHAKA_OFFSET_MS);

    const start = past ? targetDhaka : nowDhaka;
    const end = past ? nowDhaka : targetDhaka;

    const parts = breakdown(start, end);

    statusEl.textContent = past
      ? 'Counting up — time elapsed since 1 September 2030'
      : 'Counting down — time left to complete 4 years';

    units.forEach(function (unit) {
      let value = parts[unit];

      if (unit === 'milliseconds') {
        value = String(value).padStart(3, '0');
      }

      if (unit === 'microseconds') {
        // Browsers do not expose a true wall-clock microsecond timer.
        // This provides a visual sub-millisecond counter only.
        const fraction = typeof performance !== 'undefined'
          ? performance.now() % 1
          : 0;

        value = String(
          parts.millisecondsRaw * 1000
          + Math.floor(fraction * 1000)
        ).padStart(6, '0');
      }

      document.getElementById('v-' + unit).textContent = value;
    });
  }

  // Update smoothly without accumulating interval drift.
  let animationFrameId;

  function animate() {
    render();
    animationFrameId = requestAnimationFrame(animate);
  }

  animate();

  // Light/dark mode.
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme-btn');
  const sun = document.getElementById('icon-sun');
  const moon = document.getElementById('icon-moon');

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);

    sun.style.display = theme === 'dark' ? 'none' : 'block';
    moon.style.display = theme === 'dark' ? 'block' : 'none';

    try {
      localStorage.setItem('m360-theme', theme);
    } catch (error) {
      // The page still works when local storage is unavailable.
    }
  }

  let savedTheme = null;

  try {
    savedTheme = localStorage.getItem('m360-theme');
  } catch (error) {
    // Ignore storage restrictions.
  }

  const prefersDark = window.matchMedia
    && window.matchMedia('(prefers-color-scheme: dark)').matches;

  applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

  themeBtn.addEventListener('click', function () {
    const currentTheme = root.getAttribute('data-theme');
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  });

})();
</script>

</body>
</html>
